<app-main-header></app-main-header>

<div class="finish-page">
  <!-- Egyedi progress bar — 1 pipa, Sikeres vásárlás -->
  <div class="finish-progress">
    <div class="finish-progress__circle">
      <i class="fa-solid fa-check"></i>
    </div>
    <p class="finish-progress__label">Sikeres vásárlás</p>
  </div>

  <div class="finish-card">
    <div class="finish-circle">
      <i class="fa-solid fa-check"></i>
    </div>

    <h1 class="finish-title">Köszönjük a vásárlást!</h1>

    <div class="finish-notice">
      <i class="fa-solid fa-envelope-circle-check"></i>
      <p>A számlát elküldtük az e-mail címedre.</p>
    </div>

    <p class="finish-subtitle">
      Munkaszüneti napokon a kiszállítás szünetel. Munkanapokban 1–3 napon belül kézbesítünk.
    </p>

    <div class="finish-actions">
      <button class="btn-orders" (click)="goOrders()">
        <i class="fa-solid fa-user"></i>
        Profilom
      </button>
      <button class="btn-home" (click)="goHome()">
        <i class="fa-solid fa-house"></i>
        Főoldal
      </button>
    </div>
  </div>
</div>

<app-footer></app-footer>
